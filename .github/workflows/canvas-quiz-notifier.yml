name: Canvas assignment notifier

on:
  schedule:
    - cron: "0 16 * * 2"
      timezone: "Asia/Singapore"
    - cron: "0 10 * * 5"
      timezone: "Asia/Singapore"
  workflow_dispatch:
    inputs:
      run_window:
        description: "Run the one-minute polling window instead of one poll"
        required: false
        type: boolean
        default: false
      window_end:
        description: "Singapore local end time for a manual window (HH:MM or HHMM)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: canvas-assignment-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
      CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CANVAS_COURSE_IDS: ${{ vars.CANVAS_COURSE_IDS }}
      CANVAS_STATE_FILE: canvas_quiz_state.json
      RUN_WINDOW: ${{ inputs.run_window }}
      WINDOW_END: ${{ inputs.window_end }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Poll Canvas assignments and notify Telegram
        id: poll
        continue-on-error: true
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist_state() {
            if [[ -n "$(git status --porcelain -- canvas_quiz_state.json)" ]]; then
              git add canvas_quiz_state.json
              git commit -m "chore: update Canvas assignment notification state"
            fi

            if [[ -n "$(git log --oneline origin/main..HEAD)" ]]; then
              git push origin HEAD:main
            fi
          }

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" && "${RUN_WINDOW:-false}" != "true" ]]; then
            poll_status=0
            python canvas_telegram_notifier.py --once || poll_status=$?
            if ! persist_state; then
              poll_status=1
            fi
            exit "${poll_status}"
          fi

          # GitHub Actions cannot schedule a workflow every minute. Keep one
          # runner alive for this two-hour window and run the existing one-shot
          # poller on minute-aligned boundaries instead.
          window_end="${WINDOW_END:-}"
          if [[ -n "${window_end}" ]]; then
            if [[ "${window_end}" =~ ^([01][0-9]|2[0-3]):?([0-5][0-9])$ ]]; then
              window_end="${BASH_REMATCH[1]}:${BASH_REMATCH[2]}"
            else
              echo "Invalid WINDOW_END '${window_end}'; use HH:MM or HHMM."
              exit 1
            fi

            singapore_today="$(TZ=Asia/Singapore date +%F)"
            end_epoch="$(TZ=Asia/Singapore date -d "${singapore_today} ${window_end}" +%s)"
            now_epoch="$(TZ=Asia/Singapore date +%s)"
            remaining_seconds=$((end_epoch - now_epoch))
            if (( remaining_seconds <= 0 )); then
              echo "WINDOW_END '${window_end}' has already passed in Asia/Singapore."
              exit 1
            fi
            deadline=$((SECONDS + remaining_seconds))
          else
            deadline=$((SECONDS + 7200))
          fi
          next_poll=$SECONDS
          poll_count=0
          poll_failures=0

          while (( SECONDS < deadline )); do
            poll_count=$((poll_count + 1))
            echo "Starting Canvas poll ${poll_count} at $(date --iso-8601=seconds)"

            if ! python canvas_telegram_notifier.py --once; then
              poll_failures=$((poll_failures + 1))
              echo "Canvas poll ${poll_count} failed; continuing with the next poll."
            fi

            if ! persist_state; then
              poll_failures=$((poll_failures + 1))
              echo "Could not persist notification state; continuing with the next poll."
            fi

            next_poll=$((next_poll + 60))
            sleep_for=$((next_poll - SECONDS))
            if (( sleep_for > 0 && SECONDS < deadline )); then
              sleep "${sleep_for}"
            fi
          done

          # Retry any state push left pending by a transient failure.
          if ! persist_state; then
            poll_failures=$((poll_failures + 1))
          fi

          echo "Completed ${poll_count} Canvas poll(s) with ${poll_failures} failure(s)."
          if (( poll_failures > 0 )); then
            exit 1
          fi

      - name: Fail if polling failed
        if: steps.poll.outcome == 'failure'
        run: exit 1
