name: Canvas quiz notifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canvas-quiz-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
      CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CANVAS_COURSE_IDS: ${{ vars.CANVAS_COURSE_IDS }}
      CANVAS_STATE_FILE: canvas_quiz_state.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Poll Canvas and notify Telegram
        id: poll
        continue-on-error: true
        run: python canvas_telegram_notifier.py --once

      - name: Commit notification state
        if: always()
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- canvas_quiz_state.json)" ]]; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas_quiz_state.json
          git commit -m "chore: update Canvas quiz notification state"
          git push origin HEAD:main

      - name: Fail if polling failed
        if: steps.poll.outcome == 'failure'
        run: exit 1
